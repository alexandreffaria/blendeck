# The mechanical items of .github/REVIEW_CHECKLIST.md on every pull request:
# the base is main and no commit adds a large, binary or secret file.
name: PR guard

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: pr-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: PR guard
    runs-on: ubuntu-latest
    steps:
      - name: Base and head branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" = main ]; then
            echo "::error::A PR from main. Open it from a work branch."
            exit 1
          fi
          if [ "$BASE" != main ]; then
            echo "::error::Base is $BASE, not main. No stacked PRs."
            exit 1
          fi
          echo "$HEAD -> $BASE"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No large, binary or secret files
        run: bash scripts/pr-guard.sh "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
